name: CI

# Mirrors the README "Quality & CI" gate, adapted to the React/Vite toolchain:
#   byte-compile -> vite build   |   ruff -> eslint   |   pytest -> vitest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: |
          rm package-lock.json
          npm install --no-package-lock
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit + smoke tests (vitest)
        run: npm run test
      - name: Court-document corpus consistency
        run: node scripts/check-practice-corpus.mjs
      - name: Production build (vite)
        run: npm run build
