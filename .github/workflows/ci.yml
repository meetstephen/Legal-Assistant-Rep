name: CI

# Mirrors the README "Quality & CI" gate, adapted to the React/Vite toolchain:
#   byte-compile -> vite build   |   ruff -> eslint   |   pytest -> vitest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit + smoke tests (vitest)
        run: npm run test
      - name: Production build (vite)
        run: npm run build
